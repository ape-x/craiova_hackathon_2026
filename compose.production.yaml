name: airport-recovery-live
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: production
      OPERATION_MODE: ${OPERATION_MODE:-live}
      DATABASE_PATH: /data/recovery.sqlite3
      PUBLIC_BASE_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      ALLOWED_HOSTS: ${APP_DOMAIN},127.0.0.1,localhost,api
      CORS_ORIGINS: https://${APP_DOMAIN}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?Set a random OPERATOR_TOKEN of at least 32 characters}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FR24_API_KEY: ${FR24_API_KEY:-}
      FR24_ENVIRONMENT: ${FR24_ENVIRONMENT:-live}
      FR24_BOUNDS: ${FR24_BOUNDS:-46.0,43.8,23.0,26.5}
      FR24_RESULT_LIMIT: ${FR24_RESULT_LIMIT:-5}
      FLIGHT_POLL_SECONDS: ${FLIGHT_POLL_SECONDS:-30}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY:-}
      BOOKING_DEMAND_API_TOKEN: ${BOOKING_DEMAND_API_TOKEN:-}
      BOOKING_AFFILIATE_ID: ${BOOKING_AFFILIATE_ID:-}
      BOOKING_BOOKER_COUNTRY: ${BOOKING_BOOKER_COUNTRY:-ro}
      HOTEL_OFFERS_PROVIDER: ${HOTEL_OFFERS_PROVIDER:-auto}
      LITEAPI_API_KEY: ${LITEAPI_API_KEY:-}
      LITEAPI_ENVIRONMENT: ${LITEAPI_ENVIRONMENT:-sandbox}
      LITEAPI_GUEST_NATIONALITY: ${LITEAPI_GUEST_NATIONALITY:-RO}
      REAL_DATA_OVERPASS_URL: ${REAL_DATA_OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      REAL_DATA_OSRM_URL: ${REAL_DATA_OSRM_URL:-https://router.project-osrm.org}
      FLIGHT_OFFERS_PROVIDER: ${FLIGHT_OFFERS_PROVIDER:-auto}
      DUFFEL_ACCESS_TOKEN: ${DUFFEL_ACCESS_TOKEN:-}
      DUFFEL_ENVIRONMENT: ${DUFFEL_ENVIRONMENT:-sandbox}
      DISTRIBUSION_API_KEY: ${DISTRIBUSION_API_KEY:-}
      DISTRIBUSION_ENVIRONMENT: ${DISTRIBUSION_ENVIRONMENT:-sandbox}
      DISTRIBUSION_OFFERS_ENABLED: ${DISTRIBUSION_OFFERS_ENABLED:-false}
      APL_API_KEY: ${APL_API_KEY:-}
      FR24_MAX_REQUESTS: ${FR24_MAX_REQUESTS:-80}
      FR24_MAX_CREDITS: ${FR24_MAX_CREDITS:-4000}
      OBSERVATION_RETENTION_SECONDS: ${OBSERVATION_RETENTION_SECONDS:-3600}
      VOICE_MAX_SECONDS: ${VOICE_MAX_SECONDS:-180}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-45}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-resend}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:-}
      NOTIFICATION_EMAIL_FROM_NAME: ${NOTIFICATION_EMAIL_FROM_NAME:-AIR}
      NOTIFICATION_SMS_SENDER: ${NOTIFICATION_SMS_SENDER:-}
      NOTIFICATIONS_ALLOW_SIMULATION: ${NOTIFICATIONS_ALLOW_SIMULATION:-false}
    volumes:
      - recovery_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      SITE_ADDRESS: ${APP_DOMAIN:?Set APP_DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  recovery_data:
  caddy_data:
  caddy_config:
